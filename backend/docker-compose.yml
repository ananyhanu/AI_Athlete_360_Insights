services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiathlete
      POSTGRES_USER: aiathlete
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiathlete -d aiathlete"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data: